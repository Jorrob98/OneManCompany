name: AI Office Studio UI
on:
  push:
    paths:
      - "ai-office/**"
      - ".github/workflows/ai-office-studio.yml"
  pull_request:
    paths:
      - "ai-office/**"
      - ".github/workflows/ai-office-studio.yml"
permissions:
  contents: read
jobs:
  ui-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax check
        run: |
          node --check ai-office/app.js
          node --check ai-office/agents3d.mjs
          node --check ai-office/movement.mjs
          node --check ai-office/interactions.js
      - name: UI smoke tests
        run: node --test ai-office/studio.test.mjs ai-office/movement.test.mjs
      - name: Install browser test runner
        run: npm install --no-save playwright-core@1.56.1
      - name: UI interactions on desktop and mobile
        run: node ai-office/browser.test.mjs
      - name: Store actual 3D browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-office-premium-screenshots
          if-no-files-found: warn
          retention-days: 7
          path: |
            ai-office/office-premium-desktop.png
            ai-office/office-seated-desktop.png
            ai-office/office-seated-scene.png
            ai-office/office-premium-mobile.png
