name: AI Office Cloudflare Tests
on:
  push:
    paths:
      - "cloudflare/**"
      - ".github/workflows/ai-office-cloudflare.yml"
  pull_request:
    paths:
      - "cloudflare/**"
      - ".github/workflows/ai-office-cloudflare.yml"
permissions:
  contents: read
jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run private Telegram Worker tests
        run: node --test cloudflare/worker.test.mjs
