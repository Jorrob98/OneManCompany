# Deploy into the EXISTING Cloudflare Worker: ai-office-api
name = "ai-office-api"
main = "worker.mjs"
compatibility_date = "2026-10-19"
workers_dev = true
# Preserve Cloudflare dashboard origin allowlist and existing encrypted secrets.
keep_vars = true

[ai]
binding = "AI"

# Store these in Cloudflare's encrypted secrets, NEVER here:
# TELEGRAM_BOT_TOKEN
# TELEGRAM_WEBHOOK_SECRET
# TELEGRAM_OWNER_ID

# Sprint 06 server-only configuration:
# wrangler secret put AI_OFFICE_API_KEY
# AI_OFFICE_ALLOWED_ORIGINS = exact comma-separated HTTPS preview origins,
# configure as Worker variable in Cloudflare dashboard; never use *.
# The existing Telegram secrets remain optional for /api/ai endpoints.
